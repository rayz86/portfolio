<footer class="footer">

  <!-- Vector Background -->
  <img src="mazda.webp" class="footer-bg" alt="" loading="lazy" decoding="async" />

  <!-- Contact Card -->
  <div class="footer-card" appReveal>
    <div class="footer-top">
      <div class="footer-heading-wrap">
        <h2 class="footer-title">Let's build something !</h2>
      </div>
    </div>

    <div class="contact-links">
      <a [href]="'mailto:' + email" class="contact-link">
        <lucide-icon [img]="MailIcon" [size]="18"></lucide-icon>
        {{ email }}
      </a>
      <a [href]="phoneHref" class="contact-link">
        <lucide-icon [img]="PhoneIcon" [size]="18"></lucide-icon>
        {{ phone }}
      </a>
    </div>

    <div class="socials">
      @for (social of socials; track social.label) {
        <a [href]="social.href" target="_blank" rel="noopener noreferrer" [attr.aria-label]="social.label" [title]="social.label">
          <lucide-icon [img]="social.icon" [size]="22" [strokeWidth]="1.75"></lucide-icon>
        </a>
      }
    </div>

    <p class="made-with">© {{ year }} Rayyan Shaikh</p>
  </div>

</footer>
