<div class="hero">

  <!-- <p class="eyebrow">Full-Stack Developer &middot;</p> -->

  @if (fontsReady) {
    <h1 class="custom-fuzzy-style name-wrapper" aria-label="Rayyan Shaikh">
      <om-fuzzy-text [text]="'RAYYAN'" [baseIntensity]="0.3" [hoverIntensity]="0.1" [enableHover]="true" [fuzzRange]="10"
        styleClass="custom-fuzzy-style" class="line"></om-fuzzy-text>

      <om-fuzzy-text [text]="'SHAIKH'" [baseIntensity]="0.3" [hoverIntensity]="0.1" [enableHover]="true" [fuzzRange]="10"
        styleClass="custom-fuzzy-style" class="line"></om-fuzzy-text>
    </h1>
  } @else {
    <div class="name-placeholder" aria-hidden="true"></div>
  }

  <!-- <p class="tagline">I build fast, clean web products, from pixel-perfect UIs to the backends behind them.</p> -->

  <!-- <div class="cta">
    <a href="#projects" class="btn btn-primary">View my work</a>
    <a href="#contact" class="btn btn-ghost">Get in touch</a>
  </div> -->

  <ul class="tech-log" aria-label="Tech stack">
    @for (tech of stack; track tech.name) {
      <li class="tech" [title]="tech.name">
        <img [src]="iconBase + tech.icon" [alt]="tech.name" width="28" height="28" />
        <span>{{ tech.name }}</span>
      </li>
    }
  </ul>

  <a href="#about" class="scroll-indicator" [class.hidden]="scrolled" aria-label="Scroll to About">
    <span class="scroll-arrow">↓</span>
  </a>

</div>
